<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Concilium - basic workflow</title>
  <desc id="desc">A question enters a round coordinator and fans out to three independent seats from different model families. Their readings converge in an assumption map, which sends a decisive question to an evidence probe. A human ratifies the observed result into a decision ledger. The strongest rejected view is preserved, and unresolved evidence returns to another bounded round.</desc>
  <defs>
    <filter id="component-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#243447" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#40586e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3478f6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b8a6e"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ca6a24"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7655b5"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b84a5a"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>

  <g font-family="Inter, 'Segoe UI', sans-serif">
    <text x="48" y="62" fill="#243447" font-size="34" font-weight="700">Concilium - basic workflow</text>
    <text x="48" y="95" fill="#6b7788" font-size="17">The structure routes the work. Different model families change what the parallel nodes can notice.</text>
  </g>

  <!-- Edges: draw first so components sit above them. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M185 365 H225" stroke="#40586e" stroke-width="3" marker-end="url(#arrow-ink)"/>
    <path d="M415 365 H447" stroke="#3478f6" stroke-width="3"/>
    <path d="M447 222 V498" stroke="#3478f6" stroke-width="2"/>
    <path d="M447 222 H495" stroke="#2b8a6e" stroke-width="3" marker-end="url(#arrow-green)"/>
    <path d="M447 360 H495" stroke="#ca6a24" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <path d="M447 498 H495" stroke="#7655b5" stroke-width="3" marker-end="url(#arrow-purple)"/>

    <path d="M695 222 H744 V287 H775" stroke="#2b8a6e" stroke-width="3" marker-end="url(#arrow-green)"/>
    <path d="M695 360 H744 V330 H775" stroke="#ca6a24" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <path d="M695 498 H744 V373 H775" stroke="#7655b5" stroke-width="3" marker-end="url(#arrow-purple)"/>

    <path d="M870 415 V495" stroke="#40586e" stroke-width="3" marker-end="url(#arrow-ink)"/>
    <path d="M955 542 H1010" stroke="#40586e" stroke-width="3" marker-end="url(#arrow-ink)"/>
    <path d="M1080 495 V415" stroke="#b84a5a" stroke-width="3" marker-end="url(#arrow-rose)"/>
    <path d="M965 285 H1010" stroke="#7f8c99" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow-ink)"/>
    <path d="M1150 382 H1172 V640 H320 V455" stroke="#7655b5" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-purple)"/>
  </g>

  <!-- Edge labels. -->
  <g font-family="Inter, 'Segoe UI', sans-serif" font-size="11" fill="#6b7788">
    <text x="202" y="351" text-anchor="middle">frame</text>
    <text x="882" y="462">what would decide?</text>
    <text x="1092" y="458">ratify</text>
    <text x="740" y="662" text-anchor="middle" fill="#7655b5">still open → next bounded round</text>
  </g>

  <!-- Input packet. -->
  <g filter="url(#component-shadow)" font-family="Inter, 'Segoe UI', sans-serif">
    <path d="M48 310 H157 L185 338 V420 H48 Z" fill="#f8fafc" stroke="#40586e" stroke-width="2"/>
    <path d="M157 310 V338 H185" fill="#e7edf2" stroke="#40586e" stroke-width="2"/>
    <text x="68" y="342" fill="#243447" font-size="14" font-weight="700">Question</text>
    <text x="68" y="368" fill="#6b7788" font-size="11">Optionally:</text>
    <text x="68" y="386" fill="#6b7788" font-size="11">scope, evidence,</text>
    <text x="68" y="404" fill="#6b7788" font-size="11">success criteria</text>
  </g>

  <!-- Round coordinator. -->
  <g filter="url(#component-shadow)" font-family="Inter, 'Segoe UI', sans-serif">
    <rect x="225" y="275" width="190" height="180" rx="8" fill="#eaf1ff" stroke="#3478f6" stroke-width="2"/>
    <rect x="225" y="275" width="190" height="42" rx="8" fill="#3478f6"/>
    <path d="M225 309 H415 V317 H225 Z" fill="#3478f6"/>
    <text x="320" y="302" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="1">ROUND COORDINATOR</text>
    <text x="248" y="346" fill="#243447" font-size="13" font-weight="700">Prepare the round</text>
    <circle cx="249" cy="372" r="3" fill="#3478f6"/>
    <text x="260" y="376" fill="#516174" font-size="12">hide the conclusion</text>
    <circle cx="249" cy="398" r="3" fill="#3478f6"/>
    <text x="260" y="402" fill="#516174" font-size="12">assign roles and contract</text>
    <circle cx="249" cy="424" r="3" fill="#3478f6"/>
    <text x="260" y="428" fill="#516174" font-size="12">set stop conditions</text>
    <circle cx="225" cy="365" r="5" fill="#ffffff" stroke="#3478f6" stroke-width="2"/>
    <circle cx="415" cy="365" r="5" fill="#ffffff" stroke="#3478f6" stroke-width="2"/>
    <circle cx="320" cy="455" r="5" fill="#ffffff" stroke="#7655b5" stroke-width="2"/>
  </g>

  <!-- Independent model-family seats. -->
  <g font-family="Inter, 'Segoe UI', sans-serif">
    <rect x="465" y="150" width="270" height="430" rx="10" fill="#fbfcfe" stroke="#aab6c2" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="485" y="176" fill="#40586e" font-size="12" font-weight="700" letter-spacing="2">INDEPENDENT SEATS</text>
    <text x="600" y="562" text-anchor="middle" fill="#7f8c99" font-size="11">same contract · different lineages</text>

    <g filter="url(#component-shadow)">
      <rect x="495" y="185" width="200" height="75" rx="7" fill="#e8f7f1" stroke="#2b8a6e" stroke-width="2"/>
      <rect x="495" y="185" width="8" height="75" rx="4" fill="#2b8a6e"/>
      <text x="522" y="213" fill="#2b6d5b" font-size="12" font-weight="700" letter-spacing="1">MODEL FAMILY A</text>
      <text x="522" y="237" fill="#243447" font-size="14" font-weight="700">Independent reading</text>
      <text x="522" y="253" fill="#6b7788" font-size="10">assumptions · evidence · uncertainty</text>
      <circle cx="495" cy="222" r="5" fill="#ffffff" stroke="#2b8a6e" stroke-width="2"/>
      <circle cx="695" cy="222" r="5" fill="#ffffff" stroke="#2b8a6e" stroke-width="2"/>
    </g>

    <g filter="url(#component-shadow)">
      <rect x="495" y="323" width="200" height="75" rx="7" fill="#fff0e4" stroke="#ca6a24" stroke-width="2"/>
      <rect x="495" y="323" width="8" height="75" rx="4" fill="#ca6a24"/>
      <text x="522" y="351" fill="#9a4f1c" font-size="12" font-weight="700" letter-spacing="1">MODEL FAMILY B</text>
      <text x="522" y="375" fill="#243447" font-size="14" font-weight="700">Independent reading</text>
      <text x="522" y="391" fill="#6b7788" font-size="10">assumptions · evidence · uncertainty</text>
      <circle cx="495" cy="360" r="5" fill="#ffffff" stroke="#ca6a24" stroke-width="2"/>
      <circle cx="695" cy="360" r="5" fill="#ffffff" stroke="#ca6a24" stroke-width="2"/>
    </g>

    <g filter="url(#component-shadow)">
      <rect x="495" y="461" width="200" height="75" rx="7" fill="#f1ebfa" stroke="#7655b5" stroke-width="2"/>
      <rect x="495" y="461" width="8" height="75" rx="4" fill="#7655b5"/>
      <text x="522" y="489" fill="#5d438f" font-size="12" font-weight="700" letter-spacing="1">MODEL FAMILY C</text>
      <text x="522" y="513" fill="#243447" font-size="14" font-weight="700">Independent reading</text>
      <text x="522" y="529" fill="#6b7788" font-size="10">assumptions · evidence · uncertainty</text>
      <circle cx="495" cy="498" r="5" fill="#ffffff" stroke="#7655b5" stroke-width="2"/>
      <circle cx="695" cy="498" r="5" fill="#ffffff" stroke="#7655b5" stroke-width="2"/>
    </g>
  </g>

  <!-- Assumption map. -->
  <g filter="url(#component-shadow)" font-family="Inter, 'Segoe UI', sans-serif">
    <rect x="775" y="245" width="190" height="170" rx="8" fill="#eef3f6" stroke="#40586e" stroke-width="2"/>
    <rect x="775" y="245" width="190" height="42" rx="8" fill="#40586e"/>
    <path d="M775 279 H965 V287 H775 Z" fill="#40586e"/>
    <text x="870" y="272" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="1">ASSUMPTION MAP</text>
    <circle cx="800" cy="315" r="5" fill="#2b8a6e"/>
    <text x="814" y="319" fill="#516174" font-size="12">shared claims</text>
    <circle cx="800" cy="344" r="5" fill="#ca6a24"/>
    <text x="814" y="348" fill="#516174" font-size="12">conflicting assumptions</text>
    <circle cx="800" cy="373" r="5" fill="#7655b5"/>
    <text x="814" y="377" fill="#516174" font-size="12">missing evidence</text>
    <circle cx="775" cy="287" r="5" fill="#ffffff" stroke="#2b8a6e" stroke-width="2"/>
    <circle cx="775" cy="330" r="5" fill="#ffffff" stroke="#ca6a24" stroke-width="2"/>
    <circle cx="775" cy="373" r="5" fill="#ffffff" stroke="#7655b5" stroke-width="2"/>
    <circle cx="870" cy="415" r="5" fill="#ffffff" stroke="#40586e" stroke-width="2"/>
    <circle cx="965" cy="285" r="5" fill="#ffffff" stroke="#7f8c99" stroke-width="2"/>
  </g>

  <!-- Evidence probe. -->
  <g filter="url(#component-shadow)" font-family="Inter, 'Segoe UI', sans-serif">
    <rect x="785" y="495" width="170" height="95" rx="8" fill="#fff6cf" stroke="#b98500" stroke-width="2"/>
    <text x="870" y="526" text-anchor="middle" fill="#856100" font-size="12" font-weight="700" letter-spacing="1">EVIDENCE PROBE</text>
    <text x="870" y="551" text-anchor="middle" fill="#243447" font-size="14" font-weight="700">Run the decisive check</text>
    <text x="870" y="572" text-anchor="middle" fill="#6b7788" font-size="11">return the observed result</text>
    <circle cx="870" cy="495" r="5" fill="#ffffff" stroke="#b98500" stroke-width="2"/>
    <circle cx="955" cy="542" r="5" fill="#ffffff" stroke="#b98500" stroke-width="2"/>
  </g>

  <!-- Human ratifier. -->
  <g filter="url(#component-shadow)" font-family="Inter, 'Segoe UI', sans-serif">
    <rect x="1010" y="495" width="140" height="95" rx="8" fill="#fceaec" stroke="#b84a5a" stroke-width="2"/>
    <text x="1080" y="526" text-anchor="middle" fill="#953847" font-size="12" font-weight="700" letter-spacing="1">HUMAN RATIFIER</text>
    <text x="1080" y="551" text-anchor="middle" fill="#243447" font-size="13" font-weight="700">Decide what held</text>
    <text x="1080" y="572" text-anchor="middle" fill="#6b7788" font-size="11">retain responsibility</text>
    <circle cx="1010" cy="542" r="5" fill="#ffffff" stroke="#b84a5a" stroke-width="2"/>
    <circle cx="1080" cy="495" r="5" fill="#ffffff" stroke="#b84a5a" stroke-width="2"/>
  </g>

  <!-- Decision ledger. -->
  <g filter="url(#component-shadow)" font-family="Inter, 'Segoe UI', sans-serif">
    <rect x="1010" y="245" width="140" height="170" rx="8" fill="#e7f5f7" stroke="#267581" stroke-width="2"/>
    <rect x="1010" y="245" width="140" height="42" rx="8" fill="#267581"/>
    <path d="M1010 279 H1150 V287 H1010 Z" fill="#267581"/>
    <text x="1080" y="272" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700" letter-spacing="1">DECISION LEDGER</text>
    <circle cx="1034" cy="315" r="5" fill="#2b8a6e"/>
    <text x="1048" y="319" fill="#516174" font-size="11">supported</text>
    <circle cx="1034" cy="344" r="5" fill="#ca6a24"/>
    <text x="1048" y="348" fill="#516174" font-size="11">rejected view</text>
    <circle cx="1034" cy="373" r="5" fill="#7655b5"/>
    <text x="1048" y="377" fill="#516174" font-size="11">still open</text>
    <text x="1080" y="402" text-anchor="middle" fill="#267581" font-size="10" font-weight="700">EVIDENCE REMAINS VISIBLE</text>
    <circle cx="1010" cy="285" r="5" fill="#ffffff" stroke="#7f8c99" stroke-width="2"/>
    <circle cx="1080" cy="415" r="5" fill="#ffffff" stroke="#b84a5a" stroke-width="2"/>
    <circle cx="1150" cy="382" r="5" fill="#ffffff" stroke="#7655b5" stroke-width="2"/>
  </g>

  <!-- Legend. -->
  <g font-family="Inter, 'Segoe UI', sans-serif" font-size="11" fill="#6b7788">
    <path d="M48 688 H85" stroke="#40586e" stroke-width="3" marker-end="url(#arrow-ink)"/>
    <text x="96" y="692">work and evidence</text>
    <path d="M235 688 H272" stroke="#7f8c99" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="283" y="692">preserved reasoning</text>
    <path d="M443 688 H480" stroke="#7655b5" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="491" y="692">bounded return</text>
  </g>
</svg>
