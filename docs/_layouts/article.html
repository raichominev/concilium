<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/article.css' | relative_url }}">
</head>
<body>
  <div class="page">
    <aside class="site" aria-label="Site information">
      {% include article-menu.html %}
    </aside>

    <main>
      <article>
        {{ content }}
      </article>
    </main>
  </div>
</body>
</html>
